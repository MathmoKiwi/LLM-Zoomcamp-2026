services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DB:-technote}
      POSTGRES_USER: ${PG_USER:-technote}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-technote}
    ports:
      # Host 5433: 5432 is usually taken by a locally installed Postgres.
      # Everything inside the compose network still uses 5432.
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-technote}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      PG_HOST: postgres
      # Default is $TMPDIR/fastembed_cache, which the model_cache volume
      # does not cover, so every run re-downloads the models.
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      # Persist the fastembed model cache so restarts don't re-download.
      - model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  # One-shot job, not part of the default stack.
  # Run with:  docker compose run --rm ingest
  ingest:
    build: .
    profiles: ["ingest"]
    command: python ingest/ingest.py
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      - ./data:/code/data
      - model_cache:/root/.cache
    depends_on:
      qdrant:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  qdrant_data:
  pg_data:
  grafana_data:
  model_cache:
